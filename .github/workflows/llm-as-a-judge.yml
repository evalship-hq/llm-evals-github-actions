name: llm-as-a-judge
on:
  pull_request:
    paths:
      - llm-as-a-judge/**
      - .github/workflows/llm-as-a-judge.yml
  push:
    branches: [main]
jobs:
  evals:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: llm-as-a-judge
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest tests/checks # the evals' code checks on made-up replies, no model call
      - run: pytest tests/evals --junitxml=eval-results.xml -o junit_family=xunit1
        continue-on-error: true # the comparison with main decides, not one failure
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-results
          path: llm-as-a-judge/eval-results.xml
