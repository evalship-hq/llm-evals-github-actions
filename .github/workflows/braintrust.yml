name: braintrust
on:
  pull_request:
    paths:
      - braintrust/**
      - .github/workflows/braintrust.yml
  push:
    branches: [main]
jobs:
  evals:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: braintrust
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python support_bot_eval.py
        env:
          BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-results
          path: braintrust/eval-results.json
